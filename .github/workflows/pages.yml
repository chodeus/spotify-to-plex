  name: Deploy docs to GitHub Pages

  on:
    push:
      branches: ["main"]
      paths: ["docs/**"]
    # Builds (never deploys) a change to the docs or this workflow, so Ruby and action bumps are checked before merge.
    pull_request:
      paths: ["docs/**", ".github/workflows/pages.yml"]
    workflow_dispatch:

  permissions:
    contents: read

  concurrency:
    group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
    cancel-in-progress: false

  jobs:
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pages: read
      steps:
        - name: Checkout
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
          with:
            persist-credentials: false

        - name: Setup Ruby
          uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
          with:
            ruby-version: '3.4'
            bundler-cache: true
            working-directory: docs

        - name: Setup Pages
          id: pages
          uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

        - name: Build with Jekyll
          run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          working-directory: docs
          env:
            JEKYLL_ENV: production

        - name: Upload artifact
          uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
          with:
            path: docs/_site

    deploy:
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
