  name: Deploy docs to GitHub Pages

  on:
    push:
      branches: ["testing"]
      paths: ["docs/**"]
    # Builds (never deploys) a change to the docs or this workflow, so Ruby and action bumps are checked before merge.
    pull_request:
      paths: ["docs/**", ".github/workflows/pages.yml"]
    workflow_dispatch:

  permissions:
    contents: read

  concurrency:
    group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
    cancel-in-progress: false

  jobs:
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pages: read
      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: Setup Ruby
          uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
          with:
            ruby-version: '4.0'
            bundler-cache: true
            working-directory: docs

        - name: Setup Pages
          id: pages
          uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

        - name: Build with Jekyll
          run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          working-directory: docs
          env:
            JEKYLL_ENV: production

        - name: Upload artifact
          uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
          with:
            path: docs/_site

    deploy:
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
