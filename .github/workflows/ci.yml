name: CI

# Type-check, lint and unit tests; docker-publish.yml builds, scans and smoke-tests the image.
on:
  pull_request:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads packageManager from package.json; no corepack, which Node 25+ no longer ships.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      # The web app's type-check reads the sync worker's emitted declarations.
      - name: Build sync worker
        run: pnpm --filter @spotify-to-plex/sync-worker run build

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:packages
