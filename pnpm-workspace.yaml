packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11+ reads only auth/registry settings from .npmrc and ignores package.json's "pnpm"
# field, so the install settings and security overrides live here.
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true
publicHoistPattern:
  - '*@emotion/*'
  - '*@mui/*'
  - '*react*'
  - '*next*'

overrides:
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  follow-redirects@<1.16.1: ^1.16.2
  minimatch@<11.0.1: ^11.0.5
  ip-address@<10.7.1: ^10.7.6
  postcss@<8.5.18: ^8.5.32
  sharp@<0.35.5: ^0.35.5
  source-map-js@<1.2.2: ^1.2.2

# pnpm 12 fails on undecided dependency build scripts. pnpm 10 skipped these unapproved
# scripts too; `false` keeps that, so no new install scripts run.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
